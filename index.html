<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen Pro</title>
  <meta name="theme-color" content="#1f4f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen Pro">
  <meta name="description" content="Kitchen Pro: recipe library, production mode, recipe lab, and smart step timers.">
  <link rel="manifest" href="kitchenpro-v28.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=280">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div class="brand-stack">
          <div class="brand-badge logo-badge"><img src="kitchenpro-logo.png" alt="Kitchen Pro logo"></div>
          <div>
            <div class="brand-title">Kitchen Pro</div>
            <div class="brand-sub">Cook · Organize · Create</div>
          </div>
        </div>
        <div class="pill">Kitchen Pro</div>
      </div>

      <div class="hero-body">
        <div class="hero-copy">
          <h1>Better recipes. A brighter kitchen.</h1>
          <p>Build official recipes, test new versions, import pasted recipes, and keep kitchen workflows cleaner on Android and iPhone.</p>
          <div class="hero-actions">
            <button class="primary" id="heroGoLibrary">Open Library</button>
            <button class="ghost" id="heroGoImport" style="color:white;border-color:rgba(255,255,255,.22)">Import Recipe</button>
          </div>
          <div class="version-tag">Build <span id="buildTag">V2.8 Recipe Overview + Smart Timers</span></div>
        </div>
        <div class="hero-stats">
          <div class="stat"><div class="num" id="statRecipes">0</div><div class="lbl">Recipes</div></div>
          <div class="stat"><div class="num" id="statTests">0</div><div class="lbl">Saved tests</div></div>
          <div class="stat"><div class="num">📱</div><div class="lbl">Home-screen ready</div></div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <button class="mode-btn active" data-view="library">
        <div class="icon">📚</div>
        <div><strong>Library</strong><div class="meta">Official recipes</div></div>
      </button>
      <button class="mode-btn" data-view="production">
        <div class="icon">👨‍🍳</div>
        <div><strong>Production</strong><div class="meta">Kitchen mode</div></div>
      </button>
      <button class="mode-btn" data-view="lab">
        <div class="icon">🧪</div>
        <div><strong>Recipe Lab</strong><div class="meta">Test batches</div></div>
      </button>
      <button class="mode-btn" data-view="import">
        <div class="icon">⬇️</div>
        <div><strong>Import</strong><div class="meta">Paste a recipe</div></div>
      </button>
      <button class="mode-btn" data-view="data">
        <div class="icon">💾</div>
        <div><strong>Data</strong><div class="meta">Backups</div></div>
      </button>
    </div>

    <main>
      <section id="view-library" class="section"></section>
      <section id="view-production" class="section hidden"></section>
      <section id="view-lab" class="section hidden"></section>
      <section id="view-import" class="section hidden"></section>
      <section id="view-data" class="section hidden"></section>
    </main>
  </div>

  <div class="bottom-nav">
    <div class="inner">
      <button class="nav-btn active" data-view="library"><div class="ico">🏠</div><div class="lbl">Home</div></button>
      <button class="nav-btn" data-view="production"><div class="ico">👨‍🍳</div><div class="lbl">Production</div></button>
      <button class="nav-btn" data-view="lab"><div class="ico">🧪</div><div class="lbl">Recipe Lab</div></button>
      <button class="nav-btn" data-view="import"><div class="ico">⬇️</div><div class="lbl">Import</div></button>
      <button class="nav-btn" data-view="data"><div class="ico">⋯</div><div class="lbl">More</div></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="sheetHost"></div>
  <input id="jsonImportFile" class="file-input" type="file" accept=".json,application/json">

  <script src="app.js?v=280"></script>
</body>
</html>
