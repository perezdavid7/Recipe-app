<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe App V2.4</title>
<style>

:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1f2933;--muted:#69737c;--line:#e2ddd5;
  --accent:#8b3f2f;--accent-soft:#f4e6e1;--good:#2f6f4e;--warn:#94671b;--bad:#8b2c2c;
  --shadow:0 8px 24px rgba(28,22,16,.07);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-weight:750;background:#ece8e2;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:white}
button.good{background:var(--good);color:white}
button.danger{background:var(--bad);color:white}
button.ghost{background:transparent;border:1px solid var(--line)}
button.small{min-height:38px;padding:7px 10px;font-size:.88rem}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;min-height:44px;border:1px solid #d8d2c9;border-radius:11px;padding:10px 12px;background:white;color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:.9rem;font-weight:800;margin-bottom:6px}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:1.32rem;font-weight:900}.subtitle{font-size:.86rem;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:8px;overflow:auto;padding:8px 14px 12px}
.nav button{white-space:nowrap}
.nav button.active{background:var(--accent);color:white}
main{padding-bottom:50px}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.card h2,.card h3{margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.meta,.small{color:var(--muted)}.small{font-size:.83rem}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:850}
.goodbadge{background:#e6f3eb;color:var(--good)}
.warnbadge{background:#fff4d9;color:var(--warn)}
.divider{height:1px;background:var(--line);margin:14px 0}
.field{margin-bottom:14px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);border:1px dashed #cec6ba;border-radius:14px;padding:24px 12px}
.recipe-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:white}
.recipe-card h3{margin:0 0 4px}
.ingredient-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(78px,.55fr) minmax(88px,.65fr);gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.ingredient-row.flagged{border-color:#d0a34e;background:#fffaf0}
.ingredient-row.changed{border-color:#d9a18d;background:#fff8f5}
@media(max-width:520px){.ingredient-row{grid-template-columns:1fr 92px}.ingredient-row .namecell{grid-column:1/-1}}
.unit-btn{width:100%;min-height:44px;background:#f2eee8;border:1px solid #d8d2c9;text-align:left}
.fractions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.fractions button{min-height:34px;padding:5px 9px;font-size:.83rem;border:1px solid var(--line);background:white}
.checkline{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:11px 0}
.checkline input[type=checkbox]{width:22px;height:22px;min-height:22px;flex:0 0 auto;margin-top:1px}
.done{text-decoration:line-through;color:var(--muted)}
.progress{height:10px;background:#e8e3dc;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--good);width:0}
.stepnum{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eee9e2;font-weight:850;flex:0 0 auto}
.rating-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}@media(min-width:560px){.rating-grid{grid-template-columns:repeat(4,1fr)}}
.score{border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.score input{text-align:center}
.note{background:#fff7dc;border:1px solid #ead591;border-radius:13px;padding:11px}
.test-card{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}
.parse-preview{background:#faf8f4;border:1px solid var(--line);border-radius:14px;padding:12px}
.flag{font-size:.78rem;font-weight:800;color:var(--warn);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:14px;bottom:18px;z-index:50;background:#202832;color:white;padding:11px 14px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,650px);max-height:78%;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:16px;box-shadow:0 -10px 35px rgba(0,0,0,.18)}
.sheet-head{position:sticky;top:0;background:white;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:520px){.unit-grid{grid-template-columns:repeat(4,1fr)}}
.unit-grid button{background:#f3f0ea;border:1px solid var(--line)}
.group-title{font-size:.83rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin:14px 0 7px}
.kpi{font-size:1.45rem;font-weight:900}
.file-input{display:none}
.inline-select{max-width:220px}
.sticky-actions{position:sticky;bottom:0;background:rgba(246,244,239,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px}


/* V2.4 production UI — glanceable, compact, kitchen-first */
:root{
  --surface:#ffffff;--surface-soft:#fbfaf7;--accent-2:#6f3025;--timer:#a05d16;
  --timer-soft:#fff4df;--complete:#edf5ef;--focus:0 0 0 3px rgba(139,63,47,.16);
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus)}
.production-screen{display:grid;gap:14px}
.prod-topbar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.prod-title{margin:0;font-size:1.45rem;letter-spacing:-.02em}
.prod-subtitle{color:var(--muted);font-size:.88rem;margin-top:3px;max-width:620px}
.prod-hero{background:linear-gradient(145deg,#fff 0%,#fbf7f3 100%);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.prod-recipe-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,170px);gap:12px;align-items:end}
.prod-recipe-name{font-size:1.24rem;font-weight:900;line-height:1.18;letter-spacing:-.02em}
.prod-kicker{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:var(--accent);margin-bottom:5px}
.prod-progress-wrap{margin-top:14px}
.prod-progress-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.prod-progress-line strong{font-size:.86rem}
.prod-progress-line span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prod-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.prod-grid{grid-template-columns:.92fr 1.28fr}.prod-hero{padding:19px}.prod-title{font-size:1.65rem}}
.prod-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(28,22,16,.045);overflow:hidden}
.prod-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px 11px;border-bottom:1px solid #eee9e2;background:var(--surface-soft)}
.prod-panel-head h3{margin:0;font-size:1rem}
.prod-panel-head .count{font-size:.76rem;color:var(--muted);font-weight:800}
.prod-list{padding:6px 10px 10px}
.prod-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:12px 5px;border-bottom:1px solid #eeeae4;transition:.18s ease}
.prod-item:last-child{border-bottom:0}
.prod-item input[type=checkbox]{width:23px;height:23px;min-height:23px;margin:1px 0 0;accent-color:var(--good)}
.prod-item.done{background:linear-gradient(90deg,rgba(47,111,78,.055),transparent);border-radius:10px}
.prod-item.done .prod-main{opacity:.55}
.prod-item.done .prod-step-text{text-decoration:line-through;text-decoration-thickness:1px}
.prod-main{min-width:0}
.prod-ingredient-line{font-size:.97rem;line-height:1.35}
.prod-ingredient-line strong{font-weight:900}
.prod-step{grid-template-columns:28px 34px minmax(0,1fr)}
.prod-step .stepnum{width:30px;height:30px;font-size:.85rem;background:var(--accent-soft);color:var(--accent);margin-top:-2px}
.prod-step.done .stepnum{background:#e2eee6;color:var(--good)}
.prod-step-text{font-size:1rem;line-height:1.43;font-weight:650}
.prod-step-video{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:800;color:var(--accent)}
.timer-chip-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.timer-chip{min-height:34px!important;padding:6px 10px!important;border-radius:999px!important;background:var(--timer-soft)!important;color:#7f480f!important;border:1px solid #eed6ae!important;font-size:.8rem!important;font-weight:900!important}
.timer-chip.running{background:#e9f4ed!important;color:var(--good)!important;border-color:#cfe2d5!important;font-variant-numeric:tabular-nums}
.timer-chip.overdue{background:#fae7e7!important;color:var(--bad)!important;border-color:#e7c2c2!important}
.timer-action{min-height:32px!important;padding:5px 8px!important;font-size:.76rem!important}
.active-timers{position:sticky;top:118px;z-index:12;display:grid;gap:7px;margin:0 2px}
.active-timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid #ead6b8;background:rgba(255,248,236,.97);backdrop-filter:blur(10px);border-radius:13px;padding:9px 10px;box-shadow:0 7px 22px rgba(45,32,18,.10)}
.active-timer.overdue{border-color:#e2bbbb;background:#fff1f1}
.active-timer-label{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active-timer-time{font-size:.88rem;font-weight:900;font-variant-numeric:tabular-nums}
.prod-options{margin-top:11px;border-top:1px solid #eee9e2;padding-top:9px}
.prod-options summary{cursor:pointer;list-style:none;color:var(--muted);font-size:.8rem;font-weight:850;display:inline-flex;align-items:center;gap:5px}
.prod-options summary::-webkit-details-marker{display:none}
.prod-options summary::before{content:'⚙';font-size:.84rem}
.prod-options[open] summary{color:var(--ink)}
.prod-options-body{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.prod-options-note{font-size:.75rem;color:var(--muted);margin-top:6px;max-width:680px}
.prod-footer-actions{display:flex;justify-content:flex-end;margin-top:2px}
.prod-footer-actions button{background:transparent;color:var(--bad);border:1px solid #e2c8c8;min-height:38px;font-size:.82rem}
@media(max-width:520px){
  .prod-recipe-row{grid-template-columns:1fr}.prod-recipe-row select{max-width:none!important}
  .prod-topbar .inline-select{max-width:100%;width:100%}
  .prod-step{grid-template-columns:26px 31px minmax(0,1fr)}
  .prod-list{padding-left:8px;padding-right:8px}
}

/* Import/review: timers are explicitly attached to a step, never globally shown */
.imp-step-card{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;background:#fff}
.imp-step-main{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:start}
.imp-timer-config{margin:8px 0 0 39px;padding-top:8px;border-top:1px dashed #e4ded6}
.imp-timer-toggle{display:flex;align-items:center;gap:8px;font-size:.83rem;font-weight:800;color:var(--ink);margin:0}
.imp-timer-toggle input{width:19px;height:19px;min-height:19px;margin:0;accent-color:var(--accent)}
.imp-timer-fields{display:flex;align-items:center;gap:7px;margin-top:8px;max-width:520px;flex-wrap:wrap}
.imp-timer-fields input{max-width:100px;min-height:40px;text-align:center}
.imp-timer-fields button{min-width:48px}
@media(max-width:520px){.imp-step-main{grid-template-columns:30px minmax(0,1fr)}.imp-step-main .remove-step{grid-column:2;justify-self:start}.imp-timer-config{margin-left:39px}}

</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <div class="brand">Recipe App</div>
      <div class="subtitle">Production + Recipe Lab · V2.4</div>
    </div>
    <span class="badge" id="recipeCountBadge">0 recipes</span>
  </div>
  <nav class="nav wrap" aria-label="App modes">
    <button class="active" data-view="library">Library</button>
    <button data-view="production">Production</button>
    <button data-view="lab">Recipe Lab</button>
    <button data-view="import">Import Recipe</button>
    <button data-view="data">Data</button>
  </nav>
</header>

<main class="wrap">
  <section id="view-library"></section>
  <section id="view-production" class="hidden"></section>
  <section id="view-lab" class="hidden"></section>
  <section id="view-import" class="hidden"></section>
  <section id="view-data" class="hidden"></section>
</main>

<div class="toast" id="toast"></div>
<div id="sheetHost"></div>
<input id="jsonImportFile" class="file-input" type="file" accept=".json,application/json">

<script>window.RECIPE_APP_SEED = {"appVersion": 2, "recipes": [{"id": "cookie-001", "name": "Chocolate Chip Cookies", "category": "Bakery", "officialVersion": 1, "yield": {"amount": 24, "unit": "cookies", "text": "24 cookies"}, "ingredients": [{"id": "flour", "amount": 270, "unit": "g", "name": "All-purpose flour"}, {"id": "butter", "amount": 170, "unit": "g", "name": "Unsalted butter"}, {"id": "brown-sugar", "amount": 150, "unit": "g", "name": "Brown sugar"}, {"id": "white-sugar", "amount": 100, "unit": "g", "name": "White sugar"}, {"id": "eggs", "amount": 2, "unit": "each", "name": "Large eggs"}, {"id": "vanilla", "amount": 10, "unit": "mL", "name": "Vanilla extract"}, {"id": "baking-soda", "amount": 5, "unit": "g", "name": "Baking soda"}, {"id": "salt", "amount": 4, "unit": "g", "name": "Salt"}, {"id": "chips", "amount": 250, "unit": "g", "name": "Chocolate chips"}], "steps": [{"id": "s1", "text": "Preheat oven to 350\u00b0F (175\u00b0C).", "videoUrl": ""}, {"id": "s2", "text": "Cream the butter, brown sugar, and white sugar until smooth.", "videoUrl": ""}, {"id": "s3", "text": "Mix in the eggs and vanilla.", "videoUrl": ""}, {"id": "s4", "text": "Combine the dry ingredients, then mix them into the wet ingredients.", "videoUrl": ""}, {"id": "s5", "text": "Fold in the chocolate chips.", "videoUrl": ""}, {"id": "s6", "text": "Portion the dough and bake until the edges are set and the centers are still soft.", "videoUrl": ""}], "tests": []}]};</script>
<script>

(() => {
"use strict";

const STORAGE_KEY = "recipeAppV2_state";
const VOLUME_FRACTION_UNITS = new Set(["cup","cups","tbsp","tablespoon","tablespoons","tsp","teaspoon","teaspoons"]);
const UNIT_GROUPS = {
  "Weight": ["g","kg","oz","lb"],
  "Volume": ["tsp","tbsp","cup","fl oz","mL","L"],
  "Count": ["each","egg","clove","slice","piece"],
  "Package / container": ["can","jar","bag","package","bunch","container"]
};
const UNIT_ALIASES = {
  "grams":"g","gram":"g","g":"g","kilograms":"kg","kilogram":"kg","kg":"kg",
  "ounces":"oz","ounce":"oz","oz":"oz","pounds":"lb","pound":"lb","lbs":"lb","lb":"lb",
  "teaspoons":"tsp","teaspoon":"tsp","tsp":"tsp","t":"tsp",
  "tablespoons":"tbsp","tablespoon":"tbsp","tbsp":"tbsp","tbs":"tbsp",
  "cups":"cup","cup":"cup","c":"cup",
  "fluid ounces":"fl oz","fluid ounce":"fl oz","fl oz":"fl oz",
  "milliliters":"mL","milliliter":"mL","ml":"mL","liters":"L","liter":"L","l":"L",
  "each":"each","egg":"egg","eggs":"egg","clove":"clove","cloves":"clove","slice":"slice","slices":"slice",
  "piece":"piece","pieces":"piece","can":"can","cans":"can","jar":"jar","jars":"jar","bag":"bag","bags":"bag",
  "package":"package","packages":"package","pkg":"package","bunch":"bunch","bunches":"bunch",
  "container":"container","containers":"container"
};
const UNICODE_FRACTIONS = {"¼":0.25,"⅓":1/3,"½":0.5,"⅔":2/3,"¾":0.75,"⅛":0.125,"⅜":0.375,"⅝":0.625,"⅞":0.875};
const FRACTION_BUTTONS = [["¼",0.25],["⅓",1/3],["½",0.5],["⅔",2/3],["¾",0.75]];

let state = {appVersion:2.4, recipes:[]};
let activeView = "library";
let selectedRecipeId = null;
let labDraft = null;
let importDraft = null;
let editRecipeId = null;
let unitPickerTarget = null;
let productionTimerTickId = null;
let timerAudioCtx = null;

const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => `${p}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const num = v => v === "" || v === null || v === undefined ? null : Number(v);
const fmt = n => {
  const x = Number(n);
  if (!Number.isFinite(x)) return "";
  return Number.isInteger(x) ? String(x) : String(Math.round(x*1000)/1000);
};

function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1900);
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadStored(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function normalizeState(){
  state ||= {appVersion:2.4,recipes:[]};
  state.recipes ||= [];
  state.productionSessions ||= {};
  // One-time V2.4 migration: add preset timers only when older recipe data
  // never had a timerMinutes field. Explicitly disabled timers (null) stay off.
  state.recipes.forEach(r=>(r.steps||[]).forEach(step=>{
    if(!Object.prototype.hasOwnProperty.call(step,"timerMinutes")){
      const guessed=guessTimerMinutes(step.text);
      if(Number.isFinite(Number(guessed))&&Number(guessed)>0) step.timerMinutes=Number(guessed);
    }
  }));
  state.appVersion = 2.4;
}
function newProductionSession(recipe, scale=1){
  return {
    batchId:uid("batch"), recipeVersion:recipe?.officialVersion||1, scale:Number(scale)||1,
    ingredientChecks:{}, stepChecks:{}, timerMinutes:{}, timers:{},
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
}
function getProductionSession(recipeId=selectedRecipeId){
  normalizeState();
  const recipe=getRecipe(recipeId);
  if(!recipe) return null;
  let s=state.productionSessions[recipeId];
  if(!s || typeof s!=="object"){
    s=newProductionSession(recipe,1);
    state.productionSessions[recipeId]=s;
    saveState();
  }
  s.ingredientChecks ||= {}; s.stepChecks ||= {}; s.timerMinutes ||= {}; s.timers ||= {};
  if(!Number.isFinite(Number(s.scale))) s.scale=1;
  return s;
}
function saveProductionSession(session){
  if(!session) return;
  session.updatedAt=new Date().toISOString();
  saveState();
}
function stepKey(step,idx){ return String(step?.id || `step-${idx}`); }
function ingredientKey(ingredient,idx){ return String(ingredient?.id || `ingredient-${idx}`); }
function guessTimerMinutes(text){
  const s=String(text||"").toLowerCase();
  // Ranges need a human choice (for example “3 a 6 horas” / “3-6 hours”).
  // Do not silently choose one endpoint.
  if(/\d+(?:\.\d+)?\s*(?:a|to|–|—|-)\s*\d+(?:\.\d+)?\s*(?:hours?|hrs?|hr|horas?|minutes?|mins?|min|minutos?|seconds?|secs?|sec|segundos?|segs?|seg)\b/.test(s)) return null;
  // Common kitchen phrasing: “1 hora y media” / “1 hour and a half”.
  const halfHour=s.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|hr|horas?)\s*(?:y|and)\s*(?:media|half)\b/);
  if(halfHour) return Math.round((Number(halfHour[1])*60+30)*100)/100;
  let total=0, found=false;
  const h=s.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|hr|horas?)\b/);
  const m=s.match(/(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min|minutos?)\b/);
  const sec=s.match(/(\d+(?:\.\d+)?)\s*(?:seconds?|secs?|sec|segundos?|segs?|seg)\b/);
  if(h){total+=Number(h[1])*60;found=true}
  if(m){total+=Number(m[1]);found=true}
  if(sec){total+=Number(sec[1])/60;found=true}
  return found ? Math.round(total*100)/100 : null;
}
function configuredTimerMinutes(step,session,key){
  const sessionValue=Number(session?.timerMinutes?.[key]);

  return Number.isFinite(recipeValue)&&recipeValue>0 ? recipeValue : null;

function timerDisplayText(timer){

function formatTimerDuration(ms){
  const sec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;

function startStepTimer(key){
  const r=getRecipe(), session=getProductionSession(); if(!r||!session) return;
  const idx=r.steps.findIndex((s,i)=>stepKey(s,i)===key), step=r.steps[idx];

  const now=Date.now();
  session.timerMinutes[key]=Number(mins);
  session.timers[key]={stepId:key,stepNumber:idx+1,label:step?.text||"Recipe step",durationMinutes:Number(mins),startedAt:now,endAt:now+Number(mins)*60000,notified:false};

function addTimerMinutes(key,mins){

function startProductionTimerTicker(){

function tickProductionTimers(fromResume=false){
  normalizeState();
  let changed=false;
  Object.entries(state.productionSessions||{}).forEach(([recipeId,session])=>{
    Object.entries(session.timers||{}).forEach(([key,timer])=>{
      if(Number(timer.endAt)<=Date.now() && !timer.notified){
        timer.notified=true; changed=true; fireTimerAlert(recipeId,timer);
      }
    });
  });
  if(changed) saveState();
  if(activeView==="production"){
    const session=getProductionSession();
    Object.entries(session?.timers||{}).forEach(([key,timer])=>{
      const el=document.querySelector(`[data-timer-display="${CSS.escape(key)}"]`);
      if(el){el.textContent=timerDisplayText(timer);el.classList.toggle("overdue",Number(timer.endAt)<=Date.now());el.classList.toggle("running",Number(timer.endAt)>Date.now())}
      const summary=document.querySelector(`[data-summary-timer="${CSS.escape(key)}"]`);
      if(summary){summary.textContent=timerDisplayText(timer);summary.closest(".active-timer")?.classList.toggle("overdue",Number(timer.endAt)<=Date.now())}
    });
    if(fromResume){updateActiveTimerSummary();updateTimerAlertStatus()}
  }
}
function fireTimerAlert(recipeId,timer){
  const recipe=state.recipes.find(r=>r.id===recipeId);
  const title=`${recipe?.name||"Recipe"} timer`;
  const body=`Step ${timer.stepNumber||""}: ${timer.label||"Time to check this step."}`.trim();
  if(document.visibilityState==="visible"){ playTimerBeep(); toast("Timer finished — check your recipe") }
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]); }catch(e){}
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification(title,{body,tag:`recipe-${recipeId}-${timer.stepId}`}); }catch(e){}
  }
}
function armTimerAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!timerAudioCtx) timerAudioCtx=new AC();
    timerAudioCtx.resume?.().catch(()=>{});
  }catch(e){}
}
function playTimerBeep(){
  try{
    armTimerAudio(); if(!timerAudioCtx) return;
    const now=timerAudioCtx.currentTime;
    [0,.32,.64].forEach(offset=>{
      const osc=timerAudioCtx.createOscillator(), gain=timerAudioCtx.createGain();
      osc.frequency.value=880; gain.gain.setValueAtTime(.0001,now+offset); gain.gain.exponentialRampToValueAtTime(.18,now+offset+.02); gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.22);
      osc.connect(gain); gain.connect(timerAudioCtx.destination); osc.start(now+offset); osc.stop(now+offset+.24);
    });
  }catch(e){}
}
async function requestTimerAlerts(){
  armTimerAudio();
  if(!("Notification" in window)){toast("System notifications are not available in this browser");updateTimerAlertStatus();return}
  try{
    const p=await Notification.requestPermission();
    toast(p==="granted"?"Timer notifications enabled":"Notification permission was not enabled");
  }catch(e){toast("This browser cannot enable system notifications here")}
  updateTimerAlertStatus();
}
function updateTimerAlertStatus(){
  const el=$("#timerAlertStatus"); if(!el) return;
  if(!("Notification" in window)) el.textContent="Timers still save their finish time and will show the correct remaining or overdue time when you return.";
  else if(Notification.permission==="granted") el.textContent="System notification permission is enabled. Phone/browser power management can still affect background delivery, so test it on each device.";
  else if(Notification.permission==="denied") el.textContent="System notifications are blocked. Timers still persist and show overdue when the app is reopened.";
  else el.textContent="Enable alerts if you want this browser to attempt a notification when a configured step timer finishes.";
}
function testTimerAlert(){
  armTimerAudio(); playTimerBeep();
  try{ if(navigator.vibrate) navigator.vibrate([200,100,300]); }catch(e){}
  let systemSent=false;
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification("Recipe App test alert",{body:"If you can hear or see this, timer alerts are working in this browser."}); systemSent=true; }catch(e){}
  }
  toast(systemSent?"Test alert sent":"Sound/vibration test played in the app");
}

function renderImport(){
  const host=$("#view-import");
  if(!importDraft){

      <div class="grid two">

          <div class="field" style="margin-top:13px"><label>Recipe text</label><textarea id="pasteRecipe" style="min-height:320px" placeholder="Chocolate Chip Cookies&#10;Yield: 24 cookies&#10;&#10;Ingredients&#10;2 cups flour&#10;1 cup sugar&#10;2 eggs&#10;&#10;Directions&#10;Mix ingredients.&#10;Bake at 350°F for 12 minutes."></textarea></div>

        </div>
        <div class="card">

            <div class="divider"></div><strong>Yield / batch size</strong><div class="small">“Yield: 24”, “Makes 2 dozen”, “Serves 8”</div>

function parseRecipeText(text){
  const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  let title="", yieldText="", mode="unknown";
  const ingredients=[], steps=[], ambiguous=[];
  const heading = s => s.toLowerCase().replace(/[:\-]/g,"").trim();
  const isIngHead=s=>["ingredients","ingredient","ingredientes","ingrediente"].includes(heading(s));
  const isStepHead=s=>["directions","direction","instructions","instruction","method","process","preparation","steps","instrucciones","instruccion","método","metodo","proceso","preparación","preparacion","pasos"].includes(heading(s));
  const yieldRe=/^(yield|makes|serves|batch(?: size)?|rendimiento|rinde|sirve|porciones?)\s*:?\s*(.+)$/i;

  for(let li=0; li<lines.length; li++){
    const line=lines[li];
    if(!title && !isIngHead(line) && !isStepHead(line) && !yieldRe.test(line) && !looksLikeIngredient(line)){
      title=line; continue;
    }
    const ym=line.match(yieldRe);
    if(ym){yieldText=ym[2].trim();continue}
    if(isIngHead(line)){mode="ingredients";continue}
    if(isStepHead(line)){mode="steps";continue}
    if(mode==="unknown" && looksLikeIngredient(line)) mode="ingredients";
    if(mode==="ingredients"){
      if(/^\d+[\.\)]\s+/.test(line) && !looksLikeIngredient(line)){ mode="steps"; }
      else{
        const p=parseIngredientLine(line);
        ingredients.push({...p,id:uid("ing")});
        if(p.flagged) ambiguous.push(line);
        continue;
      }
    }
    if(mode==="steps"){
      const cleanStep=line.replace(/^\d+[\.\)]\s*/,"");
      steps.push({id:uid("step"),text:cleanStep,videoUrl:"",timerMinutes:guessTimerMinutes(cleanStep)});continue;
    }
    if(!title) title=line; else steps.push({id:uid("step"),text:line,videoUrl:"",timerMinutes:guessTimerMinutes(line)});
  }
  if(!title) title="Imported Recipe";
  if(!ingredients.length && lines.length){
    // fallback: any lines that parse like ingredients
    lines.forEach(line=>{if(looksLikeIngredient(line)){const p=parseIngredientLine(line);ingredients.push({...p,id:uid("ing")})}});
  }
  return {name:title,category:"",yieldText,ingredients,steps,ambiguous};
}
function looksLikeIngredient(line){
  return /^(\d+(?:\.\d+)?|\d+\s+\d+\/\d+|\d+\/\d+|[¼⅓½⅔¾⅛⅜⅝⅞])\s+/.test(line.trim());
}
function quantityToDecimal(token, maybeFrac){
  let total=0;
  const parseOne=t=>{
    if(UNICODE_FRACTIONS[t]!=null) return UNICODE_FRACTIONS[t];
    if(/^\d+\/\d+$/.test(t)){const [a,b]=t.split("/").map(Number);return b?a/b:0}
    return Number(t);
  };
  total=parseOne(token);
  if(maybeFrac && /^\d+\/\d+$/.test(maybeFrac)) total+=parseOne(maybeFrac);
  return total;
}
function parseIngredientLine(line){
  let clean=line.replace(/^[-•*]\s*/,"").trim();
  const m=clean.match(/^(\d+(?:\.\d+)?|\d+\/\d+|[¼⅓½⅔¾⅛⅜⅝⅞])(?:\s+(\d+\/\d+))?\s+(.+)$/);
  if(!m) return {amount:null,unit:"",name:clean,flagged:true,flagReason:"No clear quantity"};
  const amount=quantityToDecimal(m[1],m[2]);
  let rest=m[3].trim();
  let unit="", name=rest, flagged=false, flagReason="";
  const aliasKeys=Object.keys(UNIT_ALIASES).sort((a,b)=>b.length-a.length);
  const lower=rest.toLowerCase();
  const matchUnit=aliasKeys.find(k=>lower===k || lower.startsWith(k+" "));
  if(matchUnit){
    unit=UNIT_ALIASES[matchUnit];
    name=rest.slice(matchUnit.length).trim().replace(/^of\s+/i,"");
  }else{
    // count-like ingredients can legitimately omit a unit
    unit="each";
    name=rest;
    flagged=true;
    flagReason="Unit assumed as each";
  }
  if(!name){name=rest;flagged=true;flagReason="Ingredient name needs review"}
  return {amount,unit,name,flagged,flagReason};
}
function renderImportReview(){
  const host=$("#view-import"), editing=!!editRecipeId;
  host.innerHTML=`
    <div class="card">
      <div class="row between"><div><h2>${editing?"Edit Recipe":"Review Imported Recipe"}</h2><div class="meta">${editing?"Update ingredients, instructions, and preset timers. Changes stay local until you export/share the database.":"Fix anything that was parsed incorrectly before saving."}</div></div><span class="badge ${importDraft.ambiguous.length?"warnbadge":"goodbadge"}">${importDraft.ambiguous.length} flagged</span></div>
      <div class="grid two" style="margin-top:14px">
        <div class="field"><label>Recipe name</label><input id="impName" value="${esc(importDraft.name)}"></div>
        <div class="field"><label>Category</label><input id="impCategory" value="${esc(importDraft.category)}" placeholder="Bakery, Salsa, Prep, etc."></div>
      </div>
      <div class="field"><label>Yield / batch size</label><input id="impYield" value="${esc(importDraft.yieldText)}" placeholder="Example: 24 cookies"></div>
      <div class="divider"></div>
      <div class="row between"><h3>Ingredients</h3><button class="small" id="addImpIng">+ Ingredient</button></div>
      <div id="impIngredients"></div>
      <div class="divider"></div>
      <div class="row between"><h3>Process</h3><button class="small" id="addImpStep">+ Step</button></div>
      <div id="impSteps"></div>
      <div class="sticky-actions"><div class="actions"><button class="primary" id="saveImported">${editing?"Save Recipe Changes":"Save as Base Recipe"}</button><button class="ghost" id="cancelImport">${editing?"Cancel Edit":"Start Over"}</button></div></div>
    </div>`;
  $("#impName").addEventListener("input",e=>importDraft.name=e.target.value);
  $("#impCategory").addEventListener("input",e=>importDraft.category=e.target.value);
  $("#impYield").addEventListener("input",e=>importDraft.yieldText=e.target.value);
  $("#addImpIng").addEventListener("click",()=>{importDraft.ingredients.push({id:uid("ing"),amount:null,unit:"",name:"",flagged:true,flagReason:"New ingredient"});renderImportReview()});
  $("#addImpStep").addEventListener("click",()=>{importDraft.steps.push({id:uid("step"),text:"",videoUrl:"",timerMinutes:null});renderImportReview()});
  $("#saveImported").addEventListener("click",saveImportedRecipe);
  $("#cancelImport").addEventListener("click",()=>{importDraft=null;editRecipeId=null;renderImport()});
  renderImportIngredients();
  renderImportSteps();
}
function renderImportIngredients(){
  const host=$("#impIngredients");
  if(!importDraft.ingredients.length){host.innerHTML=`<div class="empty">No ingredients detected. Add them manually.</div>`;return}
  host.innerHTML=importDraft.ingredients.map((i,idx)=>`
    <div class="ingredient-row ${i.flagged?"flagged":""}">
      <div class="namecell">
        <label>Ingredient</label><input class="imp-name" data-idx="${idx}" value="${esc(i.name)}" placeholder="Ingredient name">
        ${i.flagged?`<div class="flag">${esc(i.flagReason||"Needs review")}</div>`:""}
      </div>
      <div><label>Amount</label>${renderAmountControls("import",i,idx)}</div>
      <div><label>Unit</label><button type="button" class="unit-btn" data-context="import" data-idx="${idx}">${esc(i.unit||"Select")}</button></div>
    </div>`).join("");
  bindIngredientEditors("import",host);
  $$(".imp-name",host).forEach(el=>el.addEventListener("input",e=>{const i=Number(e.target.dataset.idx);importDraft.ingredients[i].name=e.target.value;importDraft.ingredients[i].flagged=false}));
}
function renderImportSteps(){
  const host=$("#impSteps");
  if(!importDraft.steps.length){host.innerHTML=`<div class="empty">No process steps detected. Add them manually.</div>`;return}
  host.innerHTML=importDraft.steps.map((s,idx)=>{
    const timed=Number(s.timerMinutes)>0;
    return `<div class="imp-step-card">
      <div class="imp-step-main">
        <span class="stepnum">${idx+1}</span>
        <textarea class="imp-step" data-idx="${idx}">${esc(s.text)}</textarea>
        <button class="ghost small remove-step" data-idx="${idx}">Remove</button>
      </div>
      <div class="imp-timer-config">
        <label class="imp-timer-toggle"><input type="checkbox" class="imp-timed" data-idx="${idx}" ${timed?"checked":""}> Timed step</label>
        <div class="imp-timer-fields ${timed?"":"hidden"}" data-timer-fields="${idx}">
          <button type="button" class="ghost small imp-timer-adjust" data-idx="${idx}" data-delta="-5">−5</button>
          <button type="button" class="ghost small imp-timer-adjust" data-idx="${idx}" data-delta="-1">−1</button>
          <input class="imp-timer-minutes" data-idx="${idx}" inputmode="decimal" type="number" min="0.1" step="0.5" value="${timed?esc(fmt(s.timerMinutes)):""}" placeholder="Minutes">
          <button type="button" class="ghost small imp-timer-adjust" data-idx="${idx}" data-delta="1">+1</button>
          <button type="button" class="ghost small imp-timer-adjust" data-idx="${idx}" data-delta="5">+5</button>
          <span class="small">minutes</span>
        </div>
        <div class="small" style="margin-top:5px">When checked in Production, this timer starts automatically. You can still start it manually.</div>
      </div>
    </div>`;
  }).join("");
  $$(".imp-step",host).forEach(el=>el.addEventListener("input",e=>importDraft.steps[Number(e.target.dataset.idx)].text=e.target.value));
  $$(".imp-timed",host).forEach(el=>el.addEventListener("change",e=>{
    const idx=Number(e.target.dataset.idx), fields=host.querySelector(`[data-timer-fields="${idx}"]`);
    if(e.target.checked){
      const guessed=guessTimerMinutes(importDraft.steps[idx].text)||5;
      importDraft.steps[idx].timerMinutes=Number(importDraft.steps[idx].timerMinutes)||guessed;
      fields?.classList.remove("hidden");
      const input=host.querySelector(`.imp-timer-minutes[data-idx="${idx}"]`); if(input) input.value=fmt(importDraft.steps[idx].timerMinutes);
    }else{
      importDraft.steps[idx].timerMinutes=null; fields?.classList.add("hidden");
    }
  }));
  $$(".imp-timer-minutes",host).forEach(el=>el.addEventListener("input",e=>{
    const idx=Number(e.target.dataset.idx), v=Number(e.target.value);
    importDraft.steps[idx].timerMinutes=Number.isFinite(v)&&v>0?v:null;
  }));
  $$(".imp-timer-adjust",host).forEach(b=>b.addEventListener("click",()=>{
    const idx=Number(b.dataset.idx), delta=Number(b.dataset.delta)||0;
    const current=Number(importDraft.steps[idx].timerMinutes)||0;
    const next=Math.max(.5,Math.round((current+delta)*2)/2);
    importDraft.steps[idx].timerMinutes=next;
    const input=host.querySelector(`.imp-timer-minutes[data-idx="${idx}"]`);
    if(input) input.value=fmt(next);
  }));
  $$(".remove-step",host).forEach(b=>b.addEventListener("click",()=>{importDraft.steps.splice(Number(b.dataset.idx),1);renderImportReview()}));
}
function saveImportedRecipe(){
  const name=importDraft.name.trim(); if(!name){toast("Recipe name is required");return}
  const cleanIngredients=importDraft.ingredients.filter(i=>i.name.trim()).map(i=>({
    id:i.id||uid("ing"),name:i.name.trim(),amount:Number(i.amount||0),unit:i.unit||"each"
  }));
  if(!cleanIngredients.length){toast("Add at least one ingredient");return}
  const cleanSteps=importDraft.steps.filter(s=>s.text.trim()).map(s=>({id:s.id||uid("step"),text:s.text.trim(),videoUrl:s.videoUrl||"",timerMinutes:(Number(s.timerMinutes)>0?Number(s.timerMinutes):null)}));
  if(editRecipeId){
    const recipe=getRecipe(editRecipeId); if(!recipe){toast("Recipe could not be found");return}
    recipe.name=name; recipe.category=importDraft.category.trim()||"Recipe";
    recipe.yield={...(recipe.yield||{}),text:importDraft.yieldText.trim()||"Yield not set"};
    recipe.ingredients=cleanIngredients; recipe.steps=cleanSteps;
    recipe.officialVersion=(Number(recipe.officialVersion)||1)+1;
    delete state.productionSessions?.[recipe.id];
    selectedRecipeId=recipe.id; editRecipeId=null; importDraft=null;
    saveState(); toast("Recipe updated"); renderAll(); showView("library"); return;
  }
  const recipe={
    id:uid("recipe"),name,category:importDraft.category.trim()||"Recipe",officialVersion:1,
    yield:{text:importDraft.yieldText.trim()||"Yield not set"},
    ingredients:cleanIngredients,steps:cleanSteps,tests:[]
  };
  state.recipes.push(recipe); selectedRecipeId=recipe.id; saveState(); importDraft=null; editRecipeId=null; toast("Recipe saved"); renderAll(); showView("library");
}

function renderData(){
  const host=$("#view-data");
  host.innerHTML=`
    <div class="grid two">
      <div class="card">
        <h2>Backup & Transfer</h2>
        <div class="meta">Browser changes are saved locally. Export JSON to back up or move your recipes.</div>
        <div class="actions" style="margin-top:13px"><button class="primary" id="exportJson">Export JSON</button><button id="importJson">Import JSON</button></div>
      </div>
      <div class="card">
        <h2>Source file</h2>
        <div class="meta">In the multi-file build, recipes.json is the starter/master data file. After the first load, edits stay in local storage until you export them.</div>
        <div class="actions" style="margin-top:13px"><button class="danger" id="clearLocal">Clear Local Data</button></div>
      </div>
    </div>`;
  $("#exportJson").addEventListener("click",exportJson);
  $("#importJson").addEventListener("click",()=>$("#jsonImportFile").click());
  $("#clearLocal").addEventListener("click",()=>{
    if(!confirm("Clear locally saved recipes? You can reload recipes.json afterward.")) return;
    localStorage.removeItem(STORAGE_KEY); location.reload();
  });
}
function exportJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="recipe-app-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function importJsonFile(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const parsed=JSON.parse(rd.result);
    if(!Array.isArray(parsed.recipes)) throw new Error();
    state=parsed; normalizeState(); saveState(); selectedRecipeId=state.recipes[0]?.id||null; labDraft=null; importDraft=null; editRecipeId=null; renderAll(); tickProductionTimers(true); toast("JSON imported");
  }catch(e){alert("That is not a valid Recipe App JSON file.")}};
  rd.readAsText(file);
}

init();
})();
